<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suzuka Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        html { scroll-behavior: smooth; }
        body { background-color: #050505; color: white; font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); transition: all 0.3s ease; }
        .glass-card:hover { background: rgba(255, 255, 255, 0.06); }
        .purple-gradient { background: linear-gradient(135deg, #7C3AED 0%, #5B21B6 100%); }
        .outline-text { color: transparent; -webkit-text-stroke: 1px rgba(255,255,255,0.2); font-weight: 900; }
        .note-border { border-left: 2px solid #7C3AED; padding-left: 15px; margin-bottom: 20px; }
        
        /* Visitor Counter Styling */
        .visitor-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 6px 16px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: monospace;
            font-size: 13px;
            color: #9ca3af;
        }
        .dot { width: 6px; height: 6px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 10px #22c55e; }
        .count-num { color: #22c55e; font-weight: bold; }
    </style>
</head>
<body class="flex flex-col items-center p-6 min-h-screen">

    <div class="flex items-center space-x-2 text-[10px] font-mono mt-10 mb-12 tracking-[0.2em] text-gray-500 uppercase">
        <span class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span>
        <span>Telegram Bot • Live</span>
        <span class="text-purple-500 ml-2">@Suzuka_NameBot</span>
    </div>

    <div class="mb-10">
        <div class="visitor-badge">
            <span class="dot"></span>
            <span>Visitors:</span>
            <span class="count-num" id="count">...</span>
        </div>
    </div>

    <div class="text-center mb-12">
        <h1 class="text-7xl font-[900] italic leading-[0.85] uppercase tracking-tighter">
            SUZUKA<br>
            <span class="text-purple-600">NAME</span><br>
            <span class="outline-text">BOT</span>
        </h1>
    </div>

    <div class="grid grid-cols-2 gap-3 w-full max-w-sm mb-20">
        <a href="https://t.me/Suzuka_NameBot?start=start" class="purple-gradient col-span-2 flex items-center justify-center py-4 rounded-xl font-bold text-sm shadow-xl shadow-purple-950/20 mb-1">
            Start Bot
        </a>
        <a href="#cmd-section" class="glass-card flex items-center justify-center py-4 rounded-xl font-medium text-sm text-gray-300">
            Commands ↗
        </a>
        <a href="#notes-section" class="glass-card flex items-center justify-center py-4 rounded-xl font-medium text-sm text-gray-300">
            ⚠ Notes ↗
        </a>
    </div>

    <div class="w-full max-w-sm grid grid-cols-2 gap-3 mb-10">
        <a href="https://t.me/QuickStudy009" class="flex items-center space-x-3 p-3 glass-card rounded-xl">
            <div class="p-2 bg-blue-600/10 rounded-full text-blue-500"><svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.14.14-.26.26-.54.26l.213-3.05 5.56-5.022c.24-.213-.054-.334-.373-.121l-6.869 4.326-2.96-.924c-.64-.203-.658-.64.135-.954l11.566-4.458c.538-.196 1.006.128.832.941z"/></svg></div>
            <div><p class="text-[9px] font-bold uppercase text-gray-200">TG Group</p><p class="text-[8px] text-gray-500">@QuickStudy009</p></div>
        </a>
        <a href="https://t.me/Alpha_Monu" class="flex items-center space-x-3 p-3 glass-card rounded-xl">
            <div class="p-2 bg-blue-600/10 rounded-full text-blue-500"><svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.14.14-.26.26-.54.26l.213-3.05 5.56-5.022c.24-.213-.054-.334-.373-.121l-6.869 4.326-2.96-.924c-.64-.203-.658-.64.135-.954l11.566-4.458c.538-.196 1.006.128.832.941z"/></svg></div>
            <div><p class="text-[9px] font-bold uppercase text-gray-200">Owner</p><p class="text-[8px] text-gray-500">@Alpha_Monu</p></div>
        </a>
    </div>

    <div id="cmd-section" class="w-full max-w-sm pt-10">
        <h2 class="text-xl font-black mb-4 uppercase">Commands</h2>
        <div class="p-4 glass-card rounded-xl mb-4 flex justify-between"><span>/start</span><span class="text-[10px] text-gray-500">START</span></div>
        <div class="p-4 glass-card rounded-xl flex justify-between"><span>/name [text]</span><span class="text-[10px] text-gray-500">GENERATE</span></div>
    </div>

    <div id="notes-section" class="w-full max-w-sm pt-20 pb-20">
        <h2 class="text-xl font-black mb-6 uppercase text-purple-500">Official Notes</h2>
        <div class="note-border text-[11px] text-gray-400">
            <p class="font-bold text-gray-200">🛡️ PRIVACY & SAFETY</p>
            <p>Your privacy is priority. 100% secure.</p>
        </div>
    </div>

    <script>
        function cb(response) {
            document.getElementById('count').innerText = response.value;
        }
    </script>
    <script async src="https://api.countapi.xyz/hit/suzuka-name-bot-anish/visits?callback=cb"></script>

</body>
</html>
